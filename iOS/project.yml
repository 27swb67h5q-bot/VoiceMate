name: VoiceMate
options:
  bundleIdPrefix: com.voicemate
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    DEVELOPMENT_TEAM: ""

targets:
  VoiceMate:
    type: application
    platform: iOS
    sources:
      - path: VoiceMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicemate.app
        PRODUCT_NAME: VoiceMate
        INFOPLIST_FILE: VoiceMate/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: LiveKit
        product: LiveKit
