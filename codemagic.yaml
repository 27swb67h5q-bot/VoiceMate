workflows:
  ios-build:
    name: VoiceMate
    environment:
      xcode: latest
    scripts:
      - name: Clean and Build
        script: |
          cd iOS
          xcodebuild clean -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -configuration Release \
            2>&1 | tail -5
          xcodebuild \
            -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
