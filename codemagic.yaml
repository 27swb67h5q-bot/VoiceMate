workflows:
  ios-app:
    name: VoiceMate iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios:
        xcode: 15.4
    scripts:
      - name: Generate Xcode project from XcodeGen
        script: |
          cd iOS
          xcodegen generate
      - name: Build iOS app
        script: |
          cd iOS
          xcodebuild -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - builder@voicemate.app
