workflows:
  ios-build:
    name: VoiceMate
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          cd iOS
          xcodebuild \
            -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA for TrollStore
        script: |
          # Find .app bundle
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "VoiceMate.app" -path "*/Release-iphoneos/*" -type d | head -1)
          echo "App path: $APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            exit 1
          fi

          # Ensure Frameworks directory exists
          mkdir -p "$APP_PATH/Frameworks"

          # Find PackageFrameworks (where SPM puts dynamic frameworks)
          PKG_FW_DIR=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "PackageFrameworks" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          echo "PackageFrameworks dir: $PKG_FW_DIR"

          if [ -n "$PKG_FW_DIR" ]; then
            echo "==> Copying all frameworks from PackageFrameworks..."
            for fw in "$PKG_FW_DIR"/*.framework; do
              [ -d "$fw" ] || continue
              fw_name=$(basename "$fw")
              echo "  Embedding: $fw_name"
              rm -rf "$APP_PATH/Frameworks/$fw_name"
              cp -Rf "$fw" "$APP_PATH/Frameworks/"
            done
          else
            echo "WARNING: PackageFrameworks directory not found at expected path"
            echo "==> Searching for WebRTC.framework anywhere in DerivedData..."
          fi

          # Ensure WebRTC.framework is present (fallback if PackageFrameworks path differs)
          if [ ! -d "$APP_PATH/Frameworks/WebRTC.framework" ]; then
            WEBRTC=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "WebRTC.framework" -type d 2>/dev/null | head -1)
            if [ -n "$WEBRTC" ]; then
              echo "  Embedding WebRTC.framework (fallback) from: $WEBRTC"
              cp -Rf "$WEBRTC" "$APP_PATH/Frameworks/"
            else
              echo "ERROR: WebRTC.framework not found anywhere in DerivedData"
              echo "LiveKit dependency may have failed to resolve or WebRTC is statically linked."
              exit 1
            fi
          fi

          echo "==> Frameworks in .app bundle:"
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "  (empty)"

          # Package into IPA
          echo "==> Packaging IPA..."
          cd /tmp
          rm -rf Payload
          mkdir -p Payload
          cp -Rf "$APP_PATH" Payload/
          IPA_PATH="${CM_BUILD_DIR:-$HOME/clone}/VoiceMate.ipa"
          rm -f "$IPA_PATH"
          cd Payload && zip -r "$IPA_PATH" . -q
          cd /tmp && rm -rf Payload
          echo "IPA ready at: $IPA_PATH"
    artifacts:
      - VoiceMate.ipa
