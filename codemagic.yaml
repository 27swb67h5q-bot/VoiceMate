workflows:
  ios-build:
    name: VoiceMate iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        APP_NAME: "VoiceMate"
    scripts:
      - name: Build unsigned IPA for TrollStore
        script: |
          set -e -x
          cd iOS
          
          # Generate Xcode project from project.yml
          xcodegen generate
          
          # Build for iOS device (unsigned)
          xcodebuild \
            -project "VoiceMate.xcodeproj" \
            -scheme "VoiceMate" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          
          # Create IPA for TrollStore
          mkdir -p output/Payload
          cp -r "../build/Build/Products/Release-iphoneos/VoiceMate.app" output/Payload/
          cd output
          zip -r "../${APP_NAME}.ipa" Payload/
    artifacts:
      - iOS/VoiceMate.ipa
