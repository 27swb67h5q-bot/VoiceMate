workflows:
  ios-build:
    name: VoiceMate iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        APP_NAME: "VoiceMate"
        APP_ID: "com.voicemate.app"
    scripts:
      - name: Generate xcodeproj and build
        script: |
          set -e
          cd iOS
          
          # Generate xcodeproj from Swift Package
          swift package generate-xcodeproj
          
          # Build without signing
          xcodebuild -project "VoiceMate.xcodeproj" \
            -scheme "VoiceMate" \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath ../build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          
          # Create unsigned IPA
          mkdir -p build/Payload
          cp -r "../build/Build/Products/Release-iphoneos/VoiceMate.app" build/Payload/
          cd build
          zip -r "../$APP_NAME.ipa" Payload/
    artifacts:
      - iOS/VoiceMate.ipa
