name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned TrollStore IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and resolve packages
        run: |
          cd iOS
          rm -rf VoiceMate.xcodeproj
          xcodegen generate
          xcodebuild -resolvePackageDependencies \
            -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages"

      - name: Build app
        run: |
          cd iOS
          DERIVED_DATA="$GITHUB_WORKSPACE/DerivedData"
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project VoiceMate.xcodeproj \
            -scheme VoiceMate \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          DERIVED_DATA="$GITHUB_WORKSPACE/DerivedData"
          APP_PATH=$(find "$DERIVED_DATA" -name "VoiceMate.app" -path "*/Release-iphoneos/*" -type d | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: VoiceMate.app not found"
            exit 1
          fi

          mkdir -p "$APP_PATH/Frameworks"
          PKG_FW_DIR=$(find "$DERIVED_DATA" -type d -name "PackageFrameworks" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -n "$PKG_FW_DIR" ]; then
            for fw in "$PKG_FW_DIR"/*.framework; do
              [ -d "$fw" ] || continue
              rm -rf "$APP_PATH/Frameworks/$(basename "$fw")"
              cp -Rf "$fw" "$APP_PATH/Frameworks/"
            done
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -Rf "$APP_PATH" Payload/
          zip -r VoiceMate.ipa Payload -q
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMate.ipa
          path: VoiceMate.ipa
